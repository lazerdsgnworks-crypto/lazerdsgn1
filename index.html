    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --font-inter: 'Inter', sans-serif;
            --scroll-speed-h: 40s;
            --scroll-speed-v1: 50s;
            --scroll-speed-v2: 38s;
            --scroll-speed-v3: 43s;
            --scroll-height: -50%;

            /* Light Theme Colors */
            --bg-primary: #f9fafb; /* gray-50 */
            --bg-secondary: #ffffff; /* white */
            --bg-muted: #f3f4f6; /* gray-100 */
            --bg-hover: #e5e7eb; /* gray-200 */
            --bg-primary-accent: #000000;
            --bg-secondary-accent: #3b82f6; /* blue-500 */
            --bg-accent-hover: #1f2937; /* gray-800 */
            --text-primary: #0f1419;
            --text-secondary: #4b5563; /* gray-600 */
            --text-muted: #6b7280; /* gray-500 */
            --text-on-primary-accent: #ffffff;
            --border-primary: #e5e7eb; /* gray-200 */
            --border-secondary: #d1d5db; /* gray-300 */
            
            /* UPDATED: Light Theme Syntax Highlighting (VSCode Light+) */
            --code-keyword: #0000ff;
            --code-string: #a31515;
            --code-comment: #008000;
            --code-number: #0986e5;
            --code-function: #795e26;
            --code-punctuation: #000000;
        }

        html.dark {
            /* Dark Theme Colors */
            --bg-primary: #000000; /* True black */
            --bg-secondary: #000000; /* True black for headers, footers, cards */
            --bg-muted: #1f2937; /* gray-800 for muted elements */
            --bg-hover: #374151; /* gray-700 for hover states */
            --bg-primary-accent: #ffffff;
            --bg-secondary-accent: #60a5fa; /* blue-400 */
            --bg-accent-hover: #d1d5db; /* gray-300 */
            --text-primary: #f9fafb; /* gray-50 */
            --text-secondary: #d1d5db; /* gray-300 */
            --text-muted: #9ca3af; /* gray-400 */
            --text-on-primary-accent: #000000;
            --border-primary: #374151; /* gray-700 */
            --border-secondary: #4b5563; /* gray-600 */
            
            /* UPDATED: Dark Theme Syntax Highlighting (VSCode Dark+) */
            --code-keyword: #569cd6;
            --code-string: #ce9178;
            --code-comment: #6a9955;
            --code-number: #b5cea8;
            --code-function: #dcdcaa;
            --code-punctuation: #808080;
        }

        /* --- Global Styles using CSS Variables --- */
        .no-transition * {
            transition: none !important;
        }

        body {
            font-family: var(--font-inter);
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Reusable color classes */
        .bg-primary { background-color: var(--bg-primary); }
        .bg-secondary { background-color: var(--bg-secondary); }
        .bg-muted { background-color: var(--bg-muted); }
        .bg-primary-accent { background-color: var(--bg-primary-accent); }
        .hover\:bg-hover:hover { background-color: var(--bg-hover); }
        .hover\:bg-primary-accent-hover:hover { background-color: var(--bg-accent-hover); }

        .text-primary { color: var(--text-primary); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .text-on-primary-accent { color: var(--text-on-primary-accent); }
        
        .border-primary { border-color: var(--border-primary); }
        .border-secondary { border-color: var(--border-secondary); }

        /* Component-specific overrides */
        header {
            background-color: color-mix(in srgb, var(--bg-secondary) 95%, transparent);
            border-color: var(--border-primary);
        }
        .hero-headline {
            font-size: clamp(3rem, 8vw, 5rem);
            line-height: 1.1;
            font-weight: 700;
        }
        .page-transition {
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        .page-transition.visible {
            opacity: 1;
        }
        .slider-track {
            display: flex;
            width: fit-content;
            animation: scroll-left var(--scroll-speed-h) linear infinite;
        }
        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .slider-item {
            width: 320px;
            flex-shrink: 0;
            margin-right: 1rem;
        }
        @media (max-width: 640px) {
            .slider-item {
                width: 240px;
            }
        }
        .reviews-scroll-container {
            position: relative;
            height: 700px;
            overflow: hidden;
        }
        .reviews-scroll-container::before,
        .reviews-scroll-container::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 150px;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to bottom, var(--bg-primary) 30%, transparent);
        }
        .reviews-scroll-container::after {
            bottom: 0;
            top: auto;
            background: linear-gradient(to top, var(--bg-primary) 30%, transparent);
        }
        .review-column {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }
        .col-1 .review-column { animation: scroll-up var(--scroll-speed-v1) linear infinite; }
        .col-2 .review-column { animation: scroll-up var(--scroll-speed-v2) linear infinite; }
        .col-3 .review-column { animation: scroll-up var(--scroll-speed-v3) linear infinite; }
        @keyframes scroll-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(var(--scroll-height)); }
        }
        #chat-sidebar.collapsed {
            width: 0;
            padding: 0;
            border: none;
            overflow: hidden;
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0s linear 0.3s;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; transition: opacity 0.3s ease-in-out; }
        
        /* UPDATED: Modal styles for desktop */
        @media (min-width: 641px) {
            .modal-content { 
                transform: translateY(-20px) scale(0.95); 
                transition: transform 0.3s ease-in-out; 
            }
            .modal-overlay.open .modal-content { 
                transform: translateY(0) scale(1); 
            }
        }

        /* UPDATED: Modal styles for mobile (bottom sheet) */
        @media (max-width: 640px) {
            .modal-overlay {
                align-items: flex-end; /* Align to bottom for mobile */
            }
            .modal-content {
                width: 100%;
                max-width: 100%;
                max-height: 75vh;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                transform: translateY(100%);
                transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
                padding-top: 2.5rem; /* Space for handle */
                position: relative; /* For the handle */
            }
            .modal-overlay.open .modal-content {
                transform: translateY(0);
            }
            /* Grab handle for mobile modal */
            .modal-content::before {
                content: '';
                position: absolute;
                top: 0.75rem;
                left: 50%;
                transform: translateX(-50%);
                width: 40px;
                height: 4px;
                background-color: var(--border-primary);
                border-radius: 2px;
            }
        }

        .ai-toggle-switch { position: relative; display: inline-block; width: 38px; height: 22px; }
        .ai-toggle-switch input { opacity: 0; width: 0; height: 0; }
        .ai-toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-muted); transition: .4s; border-radius: 22px; }
        .ai-toggle-slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .ai-toggle-slider { background-color: var(--bg-secondary-accent); }
        input:checked + .ai-toggle-slider:before { transform: translateX(16px); }
        .ask-ai-active { border: 2px solid var(--bg-secondary-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bg-secondary-accent) 20%, transparent); }
        .ai-badge { display: inline-flex; align-items: center; font-size: 0.7rem; font-weight: 600; background-color: var(--bg-muted); color: var(--text-secondary); border: 1px solid var(--border-primary); padding: 2px 6px; border-radius: 9999px; line-height: 1; }
        .chat-message-container { display: flex; width: 100%; }
        .chat-avatar { width: 32px; height: 32px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; flex-shrink: 0; }
        .chat-message-bubble { padding: 0.75rem 1rem; border-radius: 1.25rem; font-size: 0.95rem; line-height: 1.7; }
        /* UPDATED: AI message now has no background for a cleaner look */
        .ai-message { background-color: transparent; padding-left: 0; padding-right: 0; color: var(--text-primary); }
        .user-message { background-color: var(--bg-primary-accent); color: var(--text-on-primary-accent); border-bottom-right-radius: 0.25rem; }
        .chat-actions button { transition: color 0.2s; }
        .session-item-container { position: relative; padding: 0.5rem 0.75rem; border-radius: 0.5rem; margin: 0.25rem 0; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
        .session-item-container.active { background-color: var(--bg-hover); }
        .session-item-container.active .session-text { font-weight: 600; color: var(--text-primary); }
        
        /* UPDATED: Shimmer animation for loading states */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .shimmer-bg {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, var(--bg-muted) 8%, var(--bg-hover) 18%, var(--bg-muted) 33%);
            background-size: 1200px 100%;
        }

        /* ADDED: Microphone listening animation */
        @keyframes mic-pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-listening {
            animation: mic-pulse 2s infinite;
            background-color: rgba(239, 68, 68, 0.1);
        }
        .mic-listening svg {
            color: #ef4444;
        }
        
        /* ADDED: Typing indicator animation */
        @keyframes typing-dot {
            0% { transform: translateY(0); opacity: 0.5; }
            20% { transform: translateY(-4px); opacity: 1; }
            40% { transform: translateY(0); opacity: 0.5; }
            100% { transform: translateY(0); opacity: 0.5; }
        }
        .typing-indicator span {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--text-muted);
            animation: typing-dot 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        html
        .theme-toggle-switch { background-color: var(--bg-muted); width: 44px; height: 24px; }
        .theme-toggle-circle { background-color: white; width: 20px; height: 20px; top: 2px; left: 2px; }
        html.dark .theme-toggle-circle { transform: translateX(20px); }

        /* ADDED: Glowing effect for active chat modes */
        .mode-active-glow {
            border-color: var(--bg-secondary-accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--bg-secondary-accent) 20%, transparent);
        }

        /* UPDATED: Code block and syntax highlighting styles */
        .code-block-wrapper {
            background-color: transparent;
            border: 1px solid var(--border-primary);
            border-radius: 0.75rem; /* 12px */
            margin: 0.75rem 0; /* Add vertical margin for spacing */
            overflow: hidden;
        }
        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: transparent; /* Removed background */
            padding: 0.5rem 1rem 0.25rem; /* Adjusted padding */
            border-bottom: none; /* Removed border */
        }
        .code-language {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-family: var(--font-inter);
            text-transform: capitalize;
        }
        .copy-code-btn {
            padding: 0.25rem;
            border-radius: 0.375rem;
            color: var(--text-muted);
            transition: color 0.2s, background-color 0.2s;
        }
        .copy-code-btn:hover {
            background-color: var(--border-primary);
            color: var(--text-primary);
        }
        .code-block-wrapper pre {
            margin: 0;
            padding: 1rem;
            overflow-x: auto;
            font-size: 0.875rem; /* 14px */
            line-height: 1.5;
            background-color: var(--bg-secondary); /* Give PRE a background */
        }
        .code-block-wrapper pre code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            white-space: pre-wrap; /* Wrap long lines */
            word-break: break-all; /* Break long words */
            color: var(--text-primary);
            background-color: transparent;
            padding: 0;
        }
        .code-keyword { color: var(--code-keyword); }
        .code-string { color: var(--code-string); }
        .code-comment { color: var(--code-comment); }
        .code-number { color: var(--code-number); }
        .code-function { color: var(--code-function); }
        .code-punctuation { color: var(--code-punctuation); }
    </style>
</head>
